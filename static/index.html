<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a0d">
  <title>CrossFit Records</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" id="brand" href="#/me" hidden>
      <img src="logo.svg" alt="" width="42" height="42">
      <span class="brand-name">CROSSFIT <b>RECORDS</b></span>
    </a>
    <div class="top-actions">
      <button type="button" class="chip" id="langBtn"></button>
      <button type="button" class="chip" id="logoutBtn" hidden></button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/me" data-tab="me" id="tabMe"></a>
    <a href="#/board" data-tab="board" id="tabBoard"></a>
    <a href="#/friends" data-tab="friends" id="tabFriends"></a>
  </nav>

  <main id="app"></main>

  <dialog id="recordDialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
