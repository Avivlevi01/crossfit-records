<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Panda watching the sunset over the sea">
  <defs>
    <clipPath id="disc"><circle cx="60" cy="60" r="58"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f0f3d"/>
      <stop offset="0.35" stop-color="#7a2466"/>
      <stop offset="0.62" stop-color="#e2452f"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff7a2b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4452c"/>
      <stop offset="0.5" stop-color="#6a2358"/>
      <stop offset="1" stop-color="#1a0e33"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#disc)">
    <!-- sky and sun -->
    <rect width="120" height="120" fill="url(#sky)"/>
    <circle cx="60" cy="72" r="36" fill="#ffb347" opacity="0.28"/>
    <circle cx="60" cy="72" r="22" fill="url(#sun)"/>

    <!-- gulls -->
    <path d="M24 34 q4 -5 8 0 q4 -5 8 0" fill="none" stroke="#1a0e33" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <path d="M82 26 q3 -4 6 0 q3 -4 6 0" fill="none" stroke="#1a0e33" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

    <!-- sea with the sun's reflection -->
    <rect y="72" width="120" height="48" fill="url(#sea)"/>
    <g fill="#ffc15a">
      <rect x="26" y="75" width="68" height="2.2" rx="1.1"/>
      <rect x="32" y="80" width="56" height="2.2" rx="1.1" opacity="0.8"/>
      <rect x="38" y="85" width="44" height="2" rx="1" opacity="0.6"/>
      <rect x="44" y="90" width="32" height="1.8" rx="0.9" opacity="0.4"/>
    </g>
    <rect y="71.5" width="120" height="1.2" fill="#ffd36b" opacity="0.7"/>

    <!-- cliff -->
    <path d="M0 104 C18 100 30 99 44 101 L78 101 C92 99 106 100 120 104 L120 120 L0 120 Z" fill="#150b24"/>

    <!-- panda, seen from behind -->
    <g stroke="#ffb347" stroke-opacity="0.55" stroke-width="0.8">
      <ellipse cx="60" cy="92" rx="17" ry="14" fill="#f6f3ee"/>
      <!-- black shoulder band -->
      <path d="M42 94 C41 80 79 80 78 94 L72 95 C72 87 48 87 48 95 Z" fill="#14101a" stroke="none"/>
      <!-- hind legs -->
      <ellipse cx="47" cy="102" rx="8" ry="4.6" fill="#14101a" stroke="none"/>
      <ellipse cx="73" cy="102" rx="8" ry="4.6" fill="#14101a" stroke="none"/>
      <!-- ears and head -->
      <circle cx="49.5" cy="58" r="5" fill="#14101a" stroke="none"/>
      <circle cx="70.5" cy="58" r="5" fill="#14101a" stroke="none"/>
      <circle cx="60" cy="68" r="13.5" fill="#f6f3ee"/>
    </g>
  </g>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#ff6a2b" stroke-width="3"/>
</svg>
