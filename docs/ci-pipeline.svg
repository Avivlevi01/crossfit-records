<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
<title id="t">The CI workout: what GitHub runs on every push</title>
<desc id="d">Five stations light up in order: push, setup of a clean Linux machine with PostgreSQL, ruff lint, 63 pytest tests and 15 JavaScript timer tests. When all pass the run is green. Cloud Build deploys in parallel and is not blocked by the tests.</desc>
