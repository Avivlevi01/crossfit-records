# Linter settings (run: ruff check .)
line-length = 110
target-version = "py313"

[lint]
# E = basic style, F = real mistakes, I = import order, B = bug traps, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# Migrations are generated by Alembic: do not reflow them by hand.
"alembic/versions/*" = ["E501"]

[lint.isort]
# The local "alembic/" folder has the same name as the library, so say it explicitly.
known-third-party = ["alembic"]

[lint.flake8-bugbear]
# FastAPI is designed around Depends(...) in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]
